# Land allocation matching Gemini 4-zone design (see site/site.yaml)
# Agents: change purposes/acres here and mirror acreage into site.yaml + parcels.geojson.
# IFC and algae paths below are planned; those files are not in this repository yet.
schema_version: 1
total_acres: 10.0
zones:
  zone1:
    name: Earth Habitat
    acres: 0.75
    purpose: earth-sheltered cells (living / R&D)
    building_program:
      - earth_sheltered_cell
      - climate_insect_rooms  # cascade stages 1–2 when gated
      - aquaponics_bay       # cascade stage 5 when gated
    cascade_stages: [1, 2, 5, 6]
    design_min_submersion_pct: 50
    ifc_models:
      - buildings/models/zone1_cell_v1.ifc
  zone2:
    name: Climate Canopy
    acres: 1.75
    purpose: controlled canopy; algae nutrient density primary
    building_program:
      - climate_canopy
      - algae_raceway_pbr
      - vertical_greens      # cascade stage 3
    cascade_stages: [3]
    algae_config: algae/cell.yaml
  zone3:
    name: Outdoor Production
    acres: 4.5
    purpose: outdoor ag / open production beds
    building_program:
      - outdoor_beds
      - staging
      - vermiculture_trays   # cascade stage 1 overflow
      - quail_runs           # cascade stage 4 when gated
    cascade_stages: [1, 4]
  zone4:
    name: Buffer / Edge
    acres: 3.0
    purpose: ecological buffer, access roads, utilities corridor
    building_program:
      - buffer
      - utilities_corridor

cascade_note: >
  Live capital cascade SoR: biology/CASCADE.md. Stage 1 (worms) is the only active spend
  until ≥$2k/mo vermiculture revenue OR a firm prepaid forward runway covers Stage-1 costs.
  Agents must not open Stage 2+ spend without Rod clearing that gate.
